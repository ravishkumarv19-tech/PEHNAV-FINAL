<html lang="en">
  <head>

    <!-- Block all search engine indexing — admin must never appear in Google -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <!-- Strict CSP — only allow connections to Supabase and self -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https://*.supabase.co blob:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>PEHNAV Admin</title>
    <!-- Favicon deliberately blank — don't advertise the admin URL -->
    <link rel="icon" href="data:," />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
